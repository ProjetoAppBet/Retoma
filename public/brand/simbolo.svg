<!-- Variante neutra: herda a cor do contexto via currentColor.
     Para uso inline (SVG embutido no JSX). Em <img src> o currentColor
     não resolve — nesses casos use uma das variantes com cor fixa. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 28 70 40" width="140" height="80" role="img" aria-label="Retoma">
  <title>Retoma — símbolo A Retomada</title>
  <path d="M 19 62 L 43 62 L 43 34 L 77 34" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
