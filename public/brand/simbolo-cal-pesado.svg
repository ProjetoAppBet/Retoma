<!-- Versão pesada: traço 15 em vez de 12. Uso exclusivo abaixo de 24 px,
     onde o traço 12 perde peso óptico.
     O path, as proporções e as coordenadas do símbolo são idênticos ao
     oficial. Apenas o viewBox foi ampliado nesta variante, para que o
     round cap (raio 7,5 com traço 15) não seja cortado:
       x: 19 - 7,5 = 11,5   ate   77 + 7,5 = 84,5   -> largura 73
       y: 34 - 7,5 = 26,5   ate   62 + 7,5 = 69,5   -> altura  43 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.5 26.5 73 43" width="146" height="86" role="img" aria-label="Retoma">
  <title>Retoma — símbolo A Retomada (versão pesada, abaixo de 24 px)</title>
  <path d="M 19 62 L 43 62 L 43 34 L 77 34" fill="none" stroke="#E9E7E2" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
